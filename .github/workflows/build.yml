name: Build Multi-Platform Binaries (Windows, Linux, ARM64)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows-x64
            os: windows-latest
            python-version: '3.10'
            archive: VisionView-windows-x64.zip
          - target: Linux-x86_64
            os: ubuntu-latest
            python-version: '3.10'
            archive: VisionView-linux-x86_64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libegl1 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Compile application
        run: |
          python build.py --clean

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VisionView-${{ matrix.target }}
          path: dist/${{ matrix.archive }}

  build-arm64:
    name: Build Linux-ARM64 (QEMU)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Linux ARM64 Binary via Docker Buildx
        run: |
          mkdir -p dist/docker-arm64
          docker buildx build --platform linux/arm64 -f Dockerfile.build -o dist/docker-arm64 .

      - name: Upload ARM64 Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionView-Linux-ARM64
          path: dist/docker-arm64/
